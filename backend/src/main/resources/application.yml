server:
  port: 8080

spring:
  application:
    name: campuslens-backend

  datasource:
    # Default to H2 in-memory mode with MySQL compatibility for seamless hackathon testing,
    # or switch to live MySQL instance via environment variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:campuslens;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

# CampusLens Navigation Algorithm Parameters
campuslens:
  routing:
    walking-speed-meters-per-min: 75.0
    floor-transition-penalty-min: 1.2
    stair-accessibility-penalty: 9999.0
